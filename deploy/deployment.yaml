apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-rose-war
spec:
  # 방/게임 상태를 메모리에 들고 있으므로 반드시 1개. 파드가 2개면 방이 둘로 갈라진다.
  # 그래서 배포 시에도 Recreate — 재배포하면 진행 중인 게임은 사라진다(새로고침하면 방을 다시 만들어야 함).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &labels
      app.kubernetes.io/name: my-rose-war
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/shinkeonkim/my-rose-war:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            # QR/공유 링크에 쓰는 주소 (Cloudflare Tunnel Public Hostname과 맞출 것)
            - { name: PUBLIC_URL, value: "https://my-rose-war.shinkeonkim.com" }
            - { name: MAX_ROOMS, value: "5" } # 동시에 열 수 있는 방 개수
            - { name: ROOM_IDLE_MINUTES, value: "60" } # 모두 나간 뒤 이 시간 동안 유휴면 방 해제
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
