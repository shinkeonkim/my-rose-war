apiVersion: v1
kind: Service
metadata:
  name: my-rose-war
spec:
  selector:
    app.kubernetes.io/name: my-rose-war
  ports:
    - name: http
      port: 80
      targetPort: http
---
# 무중단 배포 때 이전 파드가 새 파드를 찾기 위한 헤드리스 서비스 (Ready 파드 IP만 반환).
# Ingress/터널은 이 서비스를 쓰지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: my-rose-war-handoff
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: my-rose-war
  ports:
    - name: handoff
      port: 9090
      targetPort: handoff
